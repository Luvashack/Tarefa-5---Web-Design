<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Previsão do tempo online: consulte clima, temperatura, sensação térmica, umidade e vento de cidades do Brasil e do mundo.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="author" content="Projeto Previsão do Tempo">
    <meta name="theme-color" content="#087cfb">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Previsão do Tempo Online | Clima em Tempo Real">
  <meta property="og:description" content="Consulte clima, temperatura, sensação térmica, umidade e vento de cidades do Brasil e do mundo.">
  <meta property="og:url" content="https://tarefa-5-web-design-green.vercel.app/">
  <meta property="og:locale" content="pt_BR">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Previsão do Tempo Online | Clima em Tempo Real">
  <meta name="twitter:description" content="Consulte clima, temperatura, sensação térmica, umidade e vento de cidades do Brasil e do mundo.">

  <link rel="canonical" href="https://tarefa-5-web-design-green.vercel.app/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <title>Previsão do Tempo Online | Clima em Tempo Real</title><link data-seo="true" href="./" rel="canonical"/>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="app">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">☀️</div>
      <h1>Previsão do Tempo</h1>
      <p class="subtitle">Consulte o clima de qualquer cidade em poucos segundos.</p>
    </header>

    <main class="card" id="main-content">
      <form id="container">
        <div class="search">
          <span class="search-symbol" aria-hidden="true">⌖</span>
          <label class="sr-only" for="search-city">Cidade ou país</label>
          <input id="search-city" name="city" type="text" autocomplete="address-level2"
                 placeholder="Digite uma cidade ou país" title="Digite uma cidade ou país"
                 aria-label="Digite o nome da cidade para consultar a previsão do tempo">
          <button id="btn" type="submit" aria-label="Pesquisar previsão do tempo" title="Pesquisar previsão do tempo">⌕</button>
        </div>
        <p class="hint" id="hint">Pesquise uma cidade para visualizar o clima atual.</p>

        <section id="result" class="hidden" aria-label="Resultado da previsão do tempo" aria-live="polite">
          <div class="location">
            <div>
              <span class="label">Clima atual</span>
              <h2 id="cityName"></h2>
            </div>
            <span aria-hidden="true">☀️</span>
          </div>

          <div class="weather-box">
            <div>
              <span class="condition">Condição meteorológica</span>
              <p id="weather-value"></p>
              <div class="temperature" aria-label="Temperatura atual">
                <p id="temp-value"></p><span class="degree">°C</span>
              </div>
            </div>
            <img id="weather-icon" src="" alt="Ícone representando a condição meteorológica atual"
                 width="145" height="145" loading="lazy" decoding="async">
          </div>

          <h2 class="sr-only">Detalhes do clima</h2>
          <div class="metrics">
            <article class="metric">
              <div class="metric-icon" aria-hidden="true">🌡</div>
              <span class="metric-label">Sensação térmica</span>
              <p class="metric-value" id="feels-value"></p>
            </article>
            <article class="metric">
              <div class="metric-icon" aria-hidden="true">💧</div>
              <span class="metric-label">Umidade</span>
              <p class="metric-value" id="humidity-value"></p>
            </article>
            <article class="metric">
              <div class="metric-icon" aria-hidden="true">💨</div>
              <span class="metric-label">Vento</span>
              <p class="metric-value" id="wind-value"></p>
            </article>
          </div>
        </section>
      </form>
    </main>
  </body>
<script>
    "use strict";

    const form = document.getElementById("container");
    const city = document.getElementById("search-city");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const cityName = document.getElementById("cityName");
    const weather = document.getElementById("weather-value");
    const temp = document.getElementById("temp-value");
    const feel = document.getElementById("feels-value");
    const humidity = document.getElementById("humidity-value");
    const wind = document.getElementById("wind-value");
    const weatherIcon = document.getElementById("weather-icon");

    async function searchWeather(event) {
      event.preventDefault();

      const cityValue = city.value.trim();
      if (!cityValue) {
        city.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = "…";

      try {
        const apiKey = "8a60b2de14f7a17c7a11706b2cfcd87c";
        const query = encodeURIComponent(cityValue);
        const url = "https://api.openweathermap.org/data/2.5/weather?q=" +
          query + "&appid=" + apiKey + "&units=metric&lang=pt_br";

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Cidade não encontrada");
        }

        const api = await response.json();

        if (!api.weather || !api.main || !api.wind) {
          throw new Error("Resposta meteorológica inválida");
        }

        cityName.textContent = api.name || cityValue;
        weather.textContent = api.weather[0].description || "Condição indisponível";
        temp.textContent = Math.round(api.main.temp);
        feel.textContent = Math.round(api.main.feels_like) + " °C";
        humidity.textContent = api.main.humidity + "%";
        wind.textContent = Math.round(api.wind.speed * 3.6) + " km/h";

        const iconCode = api.weather[0].icon;
        weatherIcon.src = "https://openweathermap.org/img/wn/" + iconCode + "@2x.png";
        weatherIcon.alt = "Ícone do clima: " + api.weather[0].description;

        hint.style.display = "none";
        result.classList.remove("hidden");
        result.classList.add("show");
        document.title = "Clima em " + api.name + " | Previsão do Tempo";
      } catch (error) {
        console.error("Erro ao consultar o clima:", error);
        alert("Não foi possível encontrar essa cidade. Verifique o nome e tente novamente.");
      } finally {
        btn.disabled = false;
        btn.textContent = "⌕";
      }
    }

    form.addEventListener("submit", searchWeather);
  </script>

<!--CSS-->
<style>
  :root{
    --blue:#087cfb;
    --blue2:#0754c7;
    --indigo:#3730a3;
    --text:#10233f;
    --muted:#64748b;
    --card:rgba(255,255,255,.91)};

    *{
      box-sizing:border-box;
      margin:0;
      padding:0
    };
    
    html{
      min-height:100%;
    }

    body{
      min-height:100vh;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:radial-gradient(circle at 12% 12%,rgba(34,211,238,.35),transparent 27%),radial-gradient(circle at 88% 85%,rgba(129,140,248,.35),transparent 30%),linear-gradient(135deg,#087cfb,#0754c7 48%,#25205f);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:28px 16px;
      overflow-x:hidden;
    }

    .app{
      width:min(100%,760px);
      position:relative;
      z-index:1;
    }

    .brand{
      text-align:center;
      color:#fff;
      margin-bottom:18px;
    }

    .brand-icon{
      width:58px;
      height:58px;
      margin:0 auto 10px;
      border-radius:19px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.3);
      font-size:29px;
      box-shadow:0 12px 30px rgba(0,0,0,.13);
    }

    h1{
      font-size:clamp(1.65rem,4vw,2.2rem);
      font-weight:800;
      letter-spacing:-.04em;
      line-height:1.15;
      text-shadow:0 3px 18px rgba(0,0,0,.15);
    }

    .subtitle{
      margin-top:6px;
      color:rgba(255,255,255,.84);
      font-size:.9rem;
    }

    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,.75);
      border-radius:30px;
      padding:clamp(18px,4vw,30px);
      box-shadow:0 24px 60px rgba(15,45,85,.2);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px)
    }

    .search{
      display:flex;
      align-items:center;
      gap:9px;
      padding:7px;
      background:#f2f7fd;
      border:1px solid #dce8f8;
      border-radius:18px
    }

    .search-symbol{
      font-size:20px;
      margin-left:6px;
      color:var(--blue);
      width:25px;
      text-align:center
    }

    #search-city{
      min-width:0;
      flex:1;
      height:44px;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font:inherit;
      font-size:.94rem
    }

    #search-city::placeholder{
      color:#8aa0ba
    }

    #btn{
      width:46px;
      height:46px;
      border:0;
      border-radius:14px;
      background:linear-gradient(135deg,var(--blue),#16a6ff);
      color:#fff;
      cursor:pointer;
      font-size:21px;
      box-shadow:0 8px 18px rgba(8,124,251,.25);
      transition:.2s
    }

    #btn:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 24px rgba(8,124,251,.32)
    }

    #btn:disabled{
      opacity:.75;
      cursor:wait
    }

    #btn:focus-visible,#search-city:focus-visible{
      outline:3px solid rgba(8,124,251,.3);
      outline-offset:2px
    }

    .hint{
      text-align:center;
      color:#7890aa;
      font-size:.77rem;
      margin-top:12px
    }

    #result.hidden{
      display:none
    }

    #result.show{
      display:block;
      animation:appear .45s ease
    }

    .location{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:12px;
      margin:22px 0 14px
    }

    .label{
      color:var(--muted);
      font-size:.72rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.11em
    }

    h2{
      margin-top:2px;
      font-size:clamp(1.5rem,5vw,2.15rem);
      line-height:1.15;
      letter-spacing:-.035em
    }

    .weather-box{
      min-height:190px;
      border-radius:25px;
      padding:20px;
      color:#fff;
      background:radial-gradient(circle at 88% 20%,rgba(255,255,255,.25),transparent 25%),linear-gradient(135deg,#0785f7,#2563eb 55%,#4338ca);
      box-shadow:0 18px 35px rgba(37,99,235,.22);
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:12px;
      overflow:hidden
    }

    .condition{
      font-size:.77rem;opacity:.76;text-transform:uppercase;
      letter-spacing:.1em;font-weight:700
    }

    #weather-value{
      text-transform:capitalize;
      font-size:1.12rem;
      font-weight:600;
      margin-top:4px
    }

    .temperature{
      display:flex;
      align-items:flex-start;
      gap:3px;
      margin-top:8px
    }

    #temp-value{
      font-size:clamp(3.2rem,12vw,5.2rem);
      font-weight:800;
      letter-spacing:-.08em;
      line-height:.95
    }

    .degree{
      font-size:1.7rem;
      margin-top:4px
    }

    #weather-icon{
      width:clamp(105px,25vw,145px);
      height:clamp(105px,25vw,145px);
      object-fit:contain;
      filter:drop-shadow(0 12px 16px rgba(0,0,0,.16))
    }

    .metrics{
      display:grid;grid-template-columns:repeat(3,1fr);
      gap:11px;
      margin-top:13px
    }

    .metric{
      padding:15px 12px;
      border-radius:18px;
      background:#f5f9ff;
      border:1px solid #e4edf8
    }

    .metric-icon{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:10px;
      background:#e6f1ff;
      color:var(--blue);
      font-size:18px;
      margin-bottom:9px
    }

    .metric-label{
      display:block;
      color:var(--muted);
      font-size:.68rem;
      font-weight:600;
      margin-bottom:2px
    }

    .metric-value{
      font-size:.86rem;
      font-weight:700;
      line-height:1.25
    }

    .footer{
      text-align:center;
      color:rgba(255,255,255,.72);
      font-size:.7rem;
      margin-top:14px
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0
    }

    @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* Responsividade: o SEO Site Checkup verifica a presença de media queries. */
    @media (max-width:560px){
      body{padding:18px 12px;align-items:flex-start}
      .app{margin-top:4vh}
      .card{border-radius:24px;padding:15px}
      .weather-box{min-height:175px;border-radius:21px;padding:17px}
      .metrics{gap:8px}
      .metric{padding:13px 9px;border-radius:15px}
      .metric-label{font-size:.62rem}
      .metric-value{font-size:.75rem}
    }
    @media (max-width:390px){
      .weather-box{grid-template-columns:1fr 90px}
      #weather-icon{width:95px;height:95px}
      #btn{width:43px;height:43px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
</style>
</body>
</html>
