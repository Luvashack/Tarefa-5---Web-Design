<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>


  <!-- Pesquisa -->

   <form id="container">
    <i class="fa-solid fa-location-dot"></i>
  <input 
    type="text" 
    id="search-city" 
    placeholder="Digite a cidade ou país"
  >

  <button id="btn" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>


  <!-- Resultado = Mostra o resultado da pesquisa-->
   <div id="result">
  <h2 id="cityName"></h2>

  <div id="weather">
  <p id="weather-value"></p>
 <img id="weather-icon" alt="Ícone do clima" style="display: none;">
</div>

<div id="temp">

<p id="temp-value"></p>
</div>

  <p id="feels-value"></p>
  <p id="humidity-value"></p>
  <p id="wind-value"></p>
</div>
</form>


  <!-- Script -->
  <script>

    //Id = Pega todos os elemetos pelo id
const city = document.getElementById("search-city");
const btn = document.getElementById("btn");

const cityName = document.getElementById("cityName");

const weather = document.getElementById("weather-value");
const temp = document.getElementById("temp-value");
const feel = document.getElementById("feels-value");
const humidity = document.getElementById("humidity-value");
const wind = document.getElementById("wind-value");

const weatherIcon = document.getElementById("weather-icon");
const result = document.querySelector("#result");

// ESCONDE AO CARREGAR A PÁGINA
result.classList.add("hidden");

//Função que procura todas as informações do clima de um país/cidade
const searchWeather = async () => {

  if (!city.value.trim()) return;

  //Liga o projeto com a api
  try {
    const apiKey = "8a60b2de14f7a17c7a11706b2cfcd87c";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city.value}&appid=${apiKey}&units=metric&lang=pt_br`;

    const response = await fetch(url);

    if (!response.ok) {
      alert("Cidade não encontrada");
      return;
    }

    const api = await response.json();

    //Pega todas as informações do clima e coloca nos elementos descritos
    cityName.textContent = `${api.name}`;
    weather.textContent = `${api.weather[0].description}`;
    temp.textContent = `Temp: ${api.main.temp} °C`;
    feel.textContent = `Feels: ${api.main.feels_like} °C`;
    humidity.textContent = `Humidity: ${api.main.humidity}mm`;
    wind.textContent = `Wind: ${api.wind.speed} Km/h`;

    //Mostra um icone para a demosntração visual
    const iconCode = api.weather[0].icon;
    weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    weatherIcon.style.display = "block";

    // MOSTRA OS RESULTADOS
    result.classList.remove("hidden");
    result.classList.add("show");

  } catch (error) {
    console.error(error);
  }
};

btn.addEventListener("click", searchWeather);
  </script>

</body>
</html>
