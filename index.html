<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Previsão do Tempo Online | Clima em Tempo Real</title><link data-seo="true" href="./" rel="canonical"/>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>


  <!-- Pesquisa -->

   <form id="container">
    <i class="fa-solid fa-location-dot"></i>
 <input 
 aria-label="Digite o nome da cidade ou país" 
 autocomplete="address-level2" 
 id="search-city" 
 name="city" 
 placeholder="Digite a cidade ou país" type="text"/>

  <button id="btn" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>


  <!-- Resultado = Mostra o resultado da pesquisa-->
   <div id="result">
  <h2 id="cityName" aria-live="polite"></h2>

  <div id="weather">
  <p id="weather-value"></p>
 <img alt="Ícone representando a condição meteorológica atual" decoding="async" height="100" id="weather-icon" loading="lazy" style="display: none;" width="100"/>
</div>

<div id="temp">

 <p aria-label="Temperatura atual" id="temp-value"></p>
</div>

  <p aria-label="Sensação térmica" id="feels-value"></p>
  <p aria-label="Umidade" id="humidity-value"></p>
  <p aria-label="Velocidade do vento" id="wind-value"></p>
</div>
</form>


  <script>
    //Id = Pega todos os elemetos pelo id
const city = document.getElementById("search-city");
const btn = document.getElementById("btn");

const cityName = document.getElementById("cityName");

const weather = document.getElementById("weather-value");
const temp = document.getElementById("temp-value");
const feel = document.getElementById("feels-value");
const humidity = document.getElementById("humidity-value");
const wind = document.getElementById("wind-value");

const weatherIcon = document.getElementById("weather-icon");
const result = document.querySelector("#result");

// ESCONDE AO CARREGAR A PÁGINA
result.classList.add("hidden");

//Função que procura todas as informações do clima de um país/cidade
const searchWeather = async () => {

  if (!city.value.trim()) return;

  //Liga o projeto com a api
  try {
    const apiKey = "8a60b2de14f7a17c7a11706b2cfcd87c";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city.value}&appid=${apiKey}&units=metric&lang=pt_br`;

    const response = await fetch(url);

    if (!response.ok) {
      alert("Cidade não encontrada");
      return;
    }

    const api = await response.json();

    //Pega todas as informações do clima e coloca nos elementos descritos
    cityName.textContent = `${api.name}`;
    weather.textContent = `${api.weather[0].description}`;
    temp.textContent = `Temp: ${api.main.temp} °C`;
    feel.textContent = `Feels: ${api.main.feels_like} °C`;
    humidity.textContent = `Humidity: ${api.main.humidity}mm`;
    wind.textContent = `Wind: ${api.wind.speed} Km/h`;

    //Mostra um icone para a demosntração visual
    const iconCode = api.weather[0].icon;
    weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    weatherIcon.style.display = "block";

    // MOSTRA OS RESULTADOS
    result.classList.remove("hidden");
    result.classList.add("show");

  } catch (error) {
    console.error(error);
  }
};

btn.addEventListener("click", searchWeather);
  </script>

<!--CSS-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600&display=swap');

:root {
      --primary: #087cfb;
      --primary-dark: #075fc4;
      --cyan: #22d3ee;
      --text: #10233f;
      --muted: #64748b;
      --card: rgba(255, 255, 255, 0.88);
      --border: rgba(255, 255, 255, 0.72);
      --shadow: 0 24px 60px rgba(15, 45, 85, 0.20);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 15%, rgba(34, 211, 238, .32), transparent 28%),
        radial-gradient(circle at 88% 82%, rgba(99, 102, 241, .30), transparent 32%),
        linear-gradient(135deg, #087cfb 0%, #0753b9 48%, #172d78 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(4px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 260px;
      height: 260px;
      top: -90px;
      right: -60px;
      background: rgba(255, 255, 255, .13);
    }

    body::after {
      width: 210px;
      height: 210px;
      bottom: -90px;
      left: -60px;
      background: rgba(34, 211, 238, .16);
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
    }

    .brand {
      text-align: center;
      color: white;
      margin-bottom: 18px;
      animation: fadeDown .65s ease both;
    }

    .brand-badge {
      width: 54px;
      height: 54px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 1.45rem;
    }

    h1 {
      font-size: clamp(1.65rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.15;
      text-shadow: 0 3px 18px rgba(0,0,0,.16);
    }

    .subtitle {
      margin-top: 6px;
      color: rgba(255,255,255,.82);
      font-size: .88rem;
    }

    .weather-card {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: clamp(18px, 4vw, 30px);
      animation: fadeUp .7s ease both;
    }

    .search-area {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 7px;
      background: rgba(241, 247, 255, .94);
      border: 1px solid #dce8f8;
      border-radius: 18px;
      box-shadow: inset 0 1px 2px rgba(20, 50, 90, .04);
    }

    .search-icon {
      color: var(--primary);
      width: 24px;
      text-align: center;
      margin-left: 5px;
      flex: 0 0 24px;
    }

    #search-city {
      min-width: 0;
      flex: 1;
      height: 44px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: .92rem;
    }

    #search-city::placeholder {
      color: #8aa0ba;
    }

    #btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #16a6ff);
      color: white;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 8px 18px rgba(8,124,251,.25);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    #btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(8,124,251,.32);
      filter: brightness(1.04);
    }

    #btn:active {
      transform: translateY(0);
    }

    #btn:focus-visible,
    #search-city:focus-visible {
      outline: 3px solid rgba(8,124,251,.28);
      outline-offset: 2px;
    }

    #result {
      margin-top: 22px;
    }

    #result.hidden {
      display: none;
    }

    #result.show {
      display: block;
      animation: resultIn .55s ease both;
    }

    .location {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 14px;
    }

    .location-label {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .11em;
    }

    #cityName {
      margin-top: 2px;
      font-size: clamp(1.55rem, 5vw, 2.2rem);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -.035em;
    }

    .main-weather {
      position: relative;
      overflow: hidden;
      min-height: 190px;
      border-radius: 25px;
      padding: 20px;
      color: white;
      background:
        radial-gradient(circle at 88% 20%, rgba(255,255,255,.24), transparent 25%),
        linear-gradient(135deg, #0785f7, #2563eb 55%, #4338ca);
      box-shadow: 0 18px 35px rgba(37, 99, 235, .22);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .main-weather::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      right: -55px;
      bottom: -75px;
    }

    .condition-label {
      font-size: .78rem;
      opacity: .76;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 600;
    }

    #weather-value {
      margin-top: 4px;
      font-size: clamp(1.05rem, 3.5vw, 1.3rem);
      font-weight: 600;
      text-transform: capitalize;
    }

    .temperature {
      margin-top: 7px;
      display: flex;
      align-items: flex-start;
      gap: 3px;
    }

    #temp-value {
      font-size: clamp(3.2rem, 12vw, 5.2rem);
      font-weight: 800;
      letter-spacing: -.08em;
      line-height: .95;
    }

    .degree {
      font-size: 1.7rem;
      font-weight: 500;
      margin-top: 4px;
    }

    #weather-icon {
      width: clamp(105px, 25vw, 145px);
      height: clamp(105px, 25vw, 145px);
      object-fit: contain;
      filter: drop-shadow(0 12px 16px rgba(0,0,0,.16));
      animation: float 4s ease-in-out infinite;
    }

    .metrics {
      margin-top: 13px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
    }

    .metric {
      min-width: 0;
      padding: 15px 12px;
      border-radius: 18px;
      background: #f5f9ff;
      border: 1px solid #e4edf8;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .metric:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(25, 67, 110, .08);
    }

    .metric-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--primary);
      background: #e6f1ff;
      margin-bottom: 9px;
    }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .metric-value {
      color: var(--text);
      font-size: .86rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .empty-state {
      text-align: center;
      color: #7890aa;
      font-size: .78rem;
      margin-top: 14px;
    }

    .footer {
      color: rgba(255,255,255,.72);
      text-align: center;
      font-size: .7rem;
      margin-top: 14px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes resultIn {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 560px) {
      body {
        padding: 18px 12px;
        align-items: flex-start;
      }

      .app {
        margin-top: 4vh;
      }

      .weather-card {
        border-radius: 24px;
        padding: 15px;
      }

      .main-weather {
        min-height: 175px;
        border-radius: 21px;
        padding: 17px;
      }

      .metrics {
        gap: 8px;
      }

      .metric {
        padding: 13px 9px;
        border-radius: 15px;
      }

      .metric-icon {
        width: 29px;
        height: 29px;
        font-size: .8rem;
      }

      .metric-label {
        font-size: .62rem;
      }

      .metric-value {
        font-size: .75rem;
      }
    }

    @media (max-width: 390px) {
      .search-area {
        gap: 5px;
      }

      #btn {
        width: 43px;
        height: 43px;
      }

      .main-weather {
        grid-template-columns: 1fr 90px;
      }

      #weather-icon {
        width: 95px;
        height: 95px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
</style>
</body>
</html>
