<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>


  <!-- Pesquisa -->

   <form id="container">
    <i class="fa-solid fa-location-dot"></i>
  <input 
    type="text" 
    id="search-city" 
    placeholder="Digite a cidade ou país"
  >

  <button id="btn" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>


  <!-- Resultado = Mostra o resultado da pesquisa-->
   <div id="result">
  <h2 id="cityName"></h2>

  <div id="weather">
  <p id="weather-value"></p>
 <img id="weather-icon" alt="Ícone do clima" style="display: none;">
</div>

<div id="temp">

<p id="temp-value"></p>
</div>

  <p id="feels-value"></p>
  <p id="humidity-value"></p>
  <p id="wind-value"></p>
</div>
</form>


  <!-- SCRIPT -->
  <script>
    //Id = Pega todos os elemetos pelo id
const city = document.getElementById("search-city");
const btn = document.getElementById("btn");

const cityName = document.getElementById("cityName");

const weather = document.getElementById("weather-value");
const temp = document.getElementById("temp-value");
const feel = document.getElementById("feels-value");
const humidity = document.getElementById("humidity-value");
const wind = document.getElementById("wind-value");

const weatherIcon = document.getElementById("weather-icon");
const result = document.querySelector("#result");

// ESCONDE AO CARREGAR A PÁGINA
result.classList.add("hidden");

//Função que procura todas as informações do clima de um país/cidade
const searchWeather = async () => {

  if (!city.value.trim()) return;

  //Liga o projeto com a api
  try {
    const apiKey = "8a60b2de14f7a17c7a11706b2cfcd87c";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city.value}&appid=${apiKey}&units=metric&lang=pt_br`;

    const response = await fetch(url);

    if (!response.ok) {
      alert("Cidade não encontrada");
      return;
    }

    const api = await response.json();

    //Pega todas as informações do clima e coloca nos elementos descritos
    cityName.textContent = `${api.name}`;
    weather.textContent = `${api.weather[0].description}`;
    temp.textContent = `Temp: ${api.main.temp} °C`;
    feel.textContent = `Feels: ${api.main.feels_like} °C`;
    humidity.textContent = `Humidity: ${api.main.humidity}mm`;
    wind.textContent = `Wind: ${api.wind.speed} Km/h`;

    //Mostra um icone para a demosntração visual
    const iconCode = api.weather[0].icon;
    weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    weatherIcon.style.display = "block";

    // MOSTRA OS RESULTADOS
    result.classList.remove("hidden");
    result.classList.add("show");

  } catch (error) {
    console.error(error);
  }
};

btn.addEventListener("click", searchWeather);
  </script>


<!--CSS-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600&display=swap');

* {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html{
    height: 100%;
    background-color: rgb(0, 119, 255);
    display: flex;
    align-items: center;
    justify-content: center;
}



#container{
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    border: none;
    border-radius: 10px;
    height: auto;
    width: clamp(1rem, 15.8rem, 20rem);
    background-color: white;
    padding: 0 0 0 7px;
   
   
}

#container input{

    height: clamp(1rem, 1rem, 10rem);
    width: clamp(1rem, 10rem, 10rem);
    outline: none;
    border: none;
    border-radius: 7px;
    margin: auto;
}

#container #btn{
    border: none;
    outline: none;
    cursor: pointer;
    margin: auto;
    height: 19px;
    width: 1rem;
    background: white;
}

#container #weather{
    display: flex;
    align-items: center;
    justify-content: center;

    width: clamp(1rem, 12.5rem, 15rem);
    height: clamp(1rem, 5rem, 10rem);
    border-radius: 5px;
    background: rgb(42, 145, 255);
}

#container #temp{
    display: flex;
    border: solid 1px;
    font-size: clamp(10px, 17.9px, 100px);
    width: clamp(1rem, 6rem, 10rem);
    height: clamp(1rem, 3.5rem, 10rem);
    border-radius: 5px;
}

#container #feels-value{

   display: flex;
    border: solid 1px;
    font-size: clamp(10px, 18.9px, 100px);
    width: clamp(1rem, 6rem, 10rem);
    height: clamp(1rem, 3.5rem, 10rem);
    border-radius: 5px;
}

#container #humidity-value{

   display: flex;
    border: solid 1px;
    font-size: clamp(10px, 17.9px, 100px);
    width: clamp(1rem, 6rem, 10rem);
    height: clamp(1rem, 3.5rem, 10rem);
    border-radius: 5px;
}

#container #wind-value{

    display: flex;
    border: solid 1px;
    font-size: clamp(10px, 18.9px, 100px);
    width: clamp(1rem, 6rem, 10rem);
    height: clamp(1rem, 3.5rem, 10rem);
    border-radius: 5px;
}

#result{
    gap: 10px;
    padding: 0.3rem;
    flex-wrap: wrap;

}

.hidden{
    display: none;
}

.show{
    display: flex;
    justify-content: space-around;
    align-items: center;
}
</style>
</body>
</html>
